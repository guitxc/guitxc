name: Generate Datas

on:
  schedule:
    # Atualiza a cada 12 horas
    - cron: "0 */12 * * *"
  
  # Permite rodar a action manualmente
  workflow_dispatch:
  
  # Roda a action toda vez que houver um push na main
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: Platane/snk@v3
        with:
          # Seu nome de usuário no GitHub
          github_user_name: guitxc
          
          # Gera os arquivos na pasta dist
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          # A branch onde as imagens serão salvas
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
